# Production-ready compose configuration.
# Services use `expose` instead of `ports` to keep traffic within the Docker network.
# Only the reverse proxy (not shown) should bind host ports.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"

  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: base
      ASR_DEVICE: cpu
    volumes:
      - whisper_cache:/root/.cache
    expose:
      - "9000"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-journal}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-not-for-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      AUDIO_STORAGE_PATH: ${AUDIO_STORAGE_PATH:-/data/audio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-http_stt}
      STT_BASE_URL: ${STT_BASE_URL:-http://stt:9000}
      STT_TRANSCRIBE_PATH: ${STT_TRANSCRIBE_PATH:-/asr}
      STT_FORM_FIELD: ${STT_FORM_FIELD:-audio_file}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-600}
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER:-stub}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-4o-mini}
      AI_HTTP_TIMEOUT_SECONDS: ${AI_HTTP_TIMEOUT_SECONDS:-120}
    volumes:
      - audio_uploads:/data/audio
    expose:
      - "8000"
    networks:
      - default
      - proxy
    depends_on:
      - mongo
      - stt

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - default
      - proxy
    depends_on:
      - app

volumes:
  mongo_data:
  audio_uploads:
  whisper_cache:

networks:
  default:
  proxy:
    external: true
    name: ${EXTERNAL_PROXY_NETWORK:-proxy}
