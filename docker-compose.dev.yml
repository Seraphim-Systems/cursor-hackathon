# Development overrides — hot reload. Load secrets from `.env` (gitignored) like production compose.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# UI: http://localhost:5173  |  API: http://localhost:8000  |  API docs: http://localhost:8000/api/docs

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-not-for-production}
    volumes:
      - ./app/app:/app/app
      - ./app/tests:/app/tests
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

volumes:
  web_node_modules:
